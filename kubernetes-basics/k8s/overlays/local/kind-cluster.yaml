# kind cluster with port 30080 published on the host as http://localhost:8080
#
#   kind create cluster --config k8s/overlays/local/kind-cluster.yaml
#   kubectl apply -k k8s/overlays/local
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
