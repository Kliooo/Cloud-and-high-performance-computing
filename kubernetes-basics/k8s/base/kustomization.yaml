apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared definition of the system. Overlays only change what is environment
# specific (how the frontend is published, image names/tags).
resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - hpa.yaml
  - pdb.yaml
