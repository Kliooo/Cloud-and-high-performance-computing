apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: k8s-demo
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: k8s-demo
spec:
  # The only object with an address from outside the cluster. On a cloud VM
  # (k3s ServiceLB, MetalLB, any cloud controller) this becomes a real external IP;
  # the local overlay switches it to NodePort instead.
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
