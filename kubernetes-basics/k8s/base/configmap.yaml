apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: k8s-demo
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: k8s-demo
data:
  PORT: "8080"
  APP_VERSION: "1.0.0"
  # Upper bound for /api/work?n=..., keeps a single request from eating the node.
  MAX_WORK_LIMIT: "5000000"
  # Set to e.g. "5" to watch the readiness probe hold a fresh pod out of the Service.
  READY_DELAY_MS: "0"
