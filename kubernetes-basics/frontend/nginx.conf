server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # Pod name (Kubernetes sets the hostname to the pod name) — the UI shows it,
    # so frontend replication is visible as well.
    add_header X-Frontend-Pod $hostname always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header X-Frontend-Pod $hostname always;
        return 200 "ok\n";
    }

    # Everything under /api is forwarded to the backend Service (ClusterIP).
    # The Service name is resolved by the cluster DNS, so no IP is hardcoded.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 2s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # One dead replica must not turn into a user-visible 502.
        proxy_next_upstream error timeout http_502 http_503 http_504;

        add_header X-Frontend-Pod $hostname always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frontend-Pod $hostname always;
    }
}
