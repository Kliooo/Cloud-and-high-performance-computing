apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: rabbitmq-messaging
  labels:
    app: producer
    app.kubernetes.io/name: rabbitmq-messaging
    app.kubernetes.io/component: producer
    app.kubernetes.io/part-of: rabbitmq-messaging
spec:
  # Exactly one producer: it generates the traffic, a second copy would only double it.
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
        app.kubernetes.io/name: rabbitmq-messaging
        app.kubernetes.io/component: producer
        app.kubernetes.io/part-of: rabbitmq-messaging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producer
          # The same image as the consumer: only the command differs.
          image: k1io/rabbitmq-calc:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.producer"]
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: calc-config
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          # /readyz stays 503 until the broker connection is open, so a pod that cannot reach
          # RabbitMQ is taken out of the picture instead of publishing into the void.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      terminationGracePeriodSeconds: 20
