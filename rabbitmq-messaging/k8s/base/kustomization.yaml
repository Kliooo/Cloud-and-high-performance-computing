apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared definition of the system. Overlays change only what is environment specific
# (how the management UI is published, how many consumers run).
resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - rabbitmq-pvc.yaml
  - rabbitmq-deployment.yaml
  - rabbitmq-service.yaml
  - producer-deployment.yaml
  - consumer-deployment.yaml
  - pdb.yaml
