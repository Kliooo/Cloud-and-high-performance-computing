apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: rabbitmq-messaging
  labels:
    app: rabbitmq
    app.kubernetes.io/name: rabbitmq-messaging
    app.kubernetes.io/part-of: rabbitmq-messaging
type: Opaque
# Demo credentials, committed on purpose so `kubectl apply -k` works out of the box.
# For anything real: keep this manifest out of the repository and create the Secret with
# `kubectl create secret generic rabbitmq-credentials --from-literal=RABBITMQ_USER=…`.
stringData:
  RABBITMQ_USER: "123"
  RABBITMQ_PASSWORD: "123"
