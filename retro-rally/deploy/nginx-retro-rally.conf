# nginx for RETRO RALLY: game static files + API proxy to Node.
# Install:
#   sudo cp deploy/nginx-retro-rally.conf /etc/nginx/sites-available/retro-rally
#   sudo ln -s /etc/nginx/sites-available/retro-rally /etc/nginx/sites-enabled/retro-rally
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Domain: replace `server_name _;` with your own (e.g. retro-rally.example.com).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Important: the root is src/public/ only, so src/data/ (admin key, pilot
    # registry), src/lib/, tools/ and server.js are never exposed.
    root /opt/retro-rally/src/public;
    index index.html;
    charset utf-8;

    # The game: static files (index.html, css/, js/)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Node API. proxy_buffering off is mandatory: without it the multiplayer
    # Server-Sent Events will not flow.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Internal files stay blocked even if the root is changed by mistake
    location ~ ^/(src|tools|deploy|docs)/ { deny all; }
    location ~ ^/(server\.js|package\.json|README\.md)$ { deny all; }

    access_log /var/log/nginx/retro-rally.access.log;
    error_log  /var/log/nginx/retro-rally.error.log;
}
